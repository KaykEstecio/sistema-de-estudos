name: Quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Backend, build and browser QA
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: codetrack_ci
          # Disposable service credential, never used outside this job.
          POSTGRES_PASSWORD: codetrack_ci_disposable
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U codetrack_ci -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CODETRACK_TEST_ADMIN_URL: postgresql+psycopg://codetrack_ci:codetrack_ci_disposable@127.0.0.1:5432/postgres
      PYTHONIOENCODING: utf-8
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: backend/.python-version
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.14.1'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Check backend dependencies
        run: python -m pip check
      - name: Complete backend tests
        run: python -m pytest backend/tests --quality-mode=complete -q -W error --tb=short
      - name: Install frontend dependencies
        run: npm --prefix frontend ci
      - name: Build and product types
        run: npm --prefix frontend run build
      - name: Install Chromium and system dependencies
        working-directory: frontend
        run: npx --no-install playwright install --with-deps chromium
      - name: Browser QA, test types and cleanup
        run: python backend/scripts/browser_qa.py
